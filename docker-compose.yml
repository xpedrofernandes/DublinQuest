name: dublinquest
services:
  db:
    image: postgis/postgis:16-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/db/01-app-user.sql:/docker-entrypoint-initdb.d/01-app-user.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]
  web:
    build: .
    environment:
      DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      ORS_API_KEY: ${ORS_API_KEY:-}
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [backend]
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
    ports: ['127.0.0.1:5050:80']
    volumes: [pgadmin_data:/var/lib/pgadmin]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.40.0/24}
volumes:
  postgis_data:
  pgadmin_data:
